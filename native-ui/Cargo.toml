[package]
name = "clipflow-native"
version = "0.1.0"
edition = "2021"
description = "ClipFlow interfaz 100% nativa (GPU, sin WebView2 ni navegador embebido)"
license = "MIT"

[dependencies]
eframe = { version = "0.32", default-features = true }
egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
arboard = "3"

[profile.release]
opt-level = 2
strip = true
lto = false
codegen-units = 16
